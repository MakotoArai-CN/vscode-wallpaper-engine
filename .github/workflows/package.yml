name: Create VSIX Package
on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create a GitHub Release for the version in package.json
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  metadata:
    name: Read package metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: package
        shell: bash
        run: |
          VERSION=$(jq -r .version package.json)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  compatibility:
    name: Test VS Code ${{ matrix.vscode }}
    strategy:
      fail-fast: false
      matrix:
        vscode: ["1.106.1", "stable"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile tests
        run: bun run compile-tests

      - name: Build extension
        run: bun run package

      - name: Run extension tests
        run: xvfb-run -a bunx vscode-test --config vscode.test.config.mjs --code-version ${{ matrix.vscode }}

  package:
    name: Package ${{ matrix.target }}
    needs: [metadata, compatibility]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build extension
        run: bun run package

      - name: Package VSIX
        run: bunx vsce package --target ${{ matrix.target }} --out vscode-live-wallpaper-${{ needs.metadata.outputs.version }}-${{ matrix.target }}.vsix --allow-star-activation

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: vscode-live-wallpaper-${{ needs.metadata.outputs.version }}-${{ matrix.target }}.vsix
          retention-days: 7

  release:
    name: Publish ${{ needs.metadata.outputs.tag }}
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: [metadata, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum *.vsix > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || needs.metadata.outputs.tag }}
          name: Live Wallpaper ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ## Download

            Choose the VSIX that matches your operating system, then run **Extensions: Install from VSIX...** in VS Code.

            | Operating system | Package |
            | --- | --- |
            | Windows x64 | `vscode-live-wallpaper-${{ needs.metadata.outputs.version }}-win32-x64.vsix` |
            | Linux x64 | `vscode-live-wallpaper-${{ needs.metadata.outputs.version }}-linux-x64.vsix` |
            | macOS Intel | `vscode-live-wallpaper-${{ needs.metadata.outputs.version }}-darwin-x64.vsix` |

            Tested against VS Code 1.106.1 and the latest stable release. File hashes are available in `SHA256SUMS.txt`.
          files: |
            release/*.vsix
            release/SHA256SUMS.txt
